name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install .[test]

      - name: Package-data smoke test (bundled rf.json / splib06b resolve)
        run: python -c "from cramm import MicaEngine; e = MicaEngine(); print('minerals:', len(e.rf))"

      - name: CLI smoke test
        run: cramm --help

      - name: Unit tests (NC-dependent sections self-skip)
        run: python -m pytest tests/ -q
